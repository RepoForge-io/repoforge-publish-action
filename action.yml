name: 'RepoForge Publish'
description: "Publish private Python packages from GitHub Actions (GitHub Packages doesn't support PyPI). Also Docker, npm, Conda, Debian."
inputs:
  # core inputs
  package_type:
    description: 'Type of package to be published'
    required: true
    default: 'python'
    options:
      - python
      - docker
      - npm
      - conda
      - debian
  api_token:
    description: 'API token for RepoForge. Must have full access for the package type being published.'
    required: true
  hash_id:
    description: 'RepoForge hash ID'
    required: true
 
  # package dir is used by python, npm, conda and debian
  package_dir:
    description: 'Path to the directory containing the package'
    default: './dist'
    required: false

  # python, conda and debian inputs
  fail_on_conflict:
    description: 'Whether to fail the build if the package version already exists'
    required: false
    default: 'false'

  # conda inputs
  channel_name:
    description: 'Conda channel to upload to. Must already exist in RepoForge. Required where package_type=conda'
    required: false

  # docker inputs
  docker_context:
    description: "Directory to use as the Docker build context"
    required: false
    default: "."
  dockerfile:
    description: "Path to the Dockerfile (relative to context)"
    required: false
    default: "Dockerfile"
  docker_tag:
    description: 'Tag to use for the Docker image. Defaults to the current commit hash.'
    required: false
    default: 'latest'
  registry_name:
    description: 'Name of the Docker registry to publish to. Required where package_type=docker'
    required: false
  build_args:
    description: 'Build arguments for the Docker image'
    required: false
    default: ''
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'package'
  color: 'blue'
